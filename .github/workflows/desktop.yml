name: Desktop (Tauri)

# Windows-only for now: macOS runners bill at 10x the Linux/Windows minute
# rate, and there's no code to validate on Linux beyond what the web-app CI
# already covers. Add macos-latest / ubuntu-latest to the matrix once the
# desktop build is far enough along to be worth the extra minutes.
on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/core/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/core/**"
      - ".github/workflows/desktop.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # Fast feedback before spending runner minutes on the much slower Rust
      # build below — apps/web is statically exported (next.config.mjs's
      # output: "export"), which is what lets Tauri package it as local files.
      - name: Typecheck the web app
        run: pnpm --filter @vyn/web typecheck

      # tauri build runs beforeBuildCommand (web:build, i.e. `next build`,
      # producing apps/web/out) itself, then bundles it with the Rust binary
      # into a real Windows installer (NSIS .exe + MSI) under
      # src-tauri/target/release/bundle/.
      - name: Build the desktop installer
        run: pnpm --filter @vyn/desktop build

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: vyn-studio-windows-installer
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

[package]
name = "vyn-studio-desktop"
version = "0.1.0"
description = "Vyn Studio — the universal desktop client for vector databases."
authors = ["Vyn"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vyn_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Backs the http_fetch command: a native HTTP client has no concept of
# browser CORS, so it reaches self-hosted/CORS-restricted vector DBs
# directly — no local bridge process needed in the desktop build. Runs on
# Tauri's own existing async runtime, so no separate tokio dependency needed.
# gzip/brotli/deflate so compressed responses are decoded (a browser does this
# transparently); the shared Client below reuses the connection pool.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate"] }
